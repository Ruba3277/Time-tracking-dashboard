<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <!-- Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Rubik Font: 300, 400, 500 -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Time tracking dashboard</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  
</head>
<body>
  <header></header>
  <main class="dashboard">
    <section class="profile">
      <div class="profile-card">
        <div class="profile-info">
          <img src="images/image-jeremy.png" alt="image-jeremy">
          <div class="profile-name">
            <span>Report for</span>
            <h1>Jeremy Robson</h1>
          </div>
          
        </div>
        <div class="time-options">
          <button type="button" id=daily>Daily</button>
          <button type="button" id="weekly" class="active">Weekly</button>
          <button type="button" id="monthly">Monthly</button>

        </div>

      </div>
    </section>
    <section class="activities" id="activities">
      <div class="activity-card">
        <div class="activity-content">
          <div class="activity-header">
            <h2 class="activity-title">Work</h2>
            <button>...</button>
          </div>
          <div class="activity-time">
            <h3 class="current-hours">5hrs</h3>
            <p class="previous-hours">Last week - 7hrs</p>
          </div>
        </div>
      </div>

    </section>
  </main>
  <footer></footer>
  <script src="script.js"></script>
</body>
</html>
